<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#05050a">
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Sumo Arena</title>
  <style>
    /* Kills double-tap-to-zoom everywhere by default (login screen included)
       without blocking normal single taps/typing. The touch control zones
       below override this back to `none` where they handle raw drag
       gestures themselves and want zero native interference. */
    * {
      touch-action: manipulation;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background: #05050a;
      font-family: 'Segoe UI', Tahoma, Verdana, sans-serif;
      color: #fff;
    }
    #app { position: relative; width: 100vw; height: 100vh; height: 100dvh; }
    canvas { display: block; }

    /* Every HUD/overlay element below is intentionally `position: fixed`,
       anchored to the real viewport, NOT `position: absolute` inside #app.
       Diagnosed via a live production report: on at least one real
       browser, #app's computed height (driven by 100vh/100dvh) resolves
       far smaller than the actual viewport, so any `position:absolute`
       child anchored from the bottom with a large-enough offset (or
       height) gets pushed above the top of the page — invisible, with no
       way to scroll to it (body has overflow:hidden). A tiny bottom offset
       (like the old version tag) could still coincidentally land on
       screen, which is what made this so confusing to pin down: it wasn't
       an all-or-nothing failure. `position: fixed` sidesteps #app's box
       entirely and was confirmed working via a live test in the same
       browser, so every overlay uses it now. */
    #hud {
      position: fixed;
      top: max(12px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left));
      background: rgba(0,0,0,0.45);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 14px;
      pointer-events: none;
      line-height: 1.5;
    }
    /* Mobile's own browser chrome (URL bar) already eats real vertical
       space at the exact top edge these elements anchor to, on top of
       whatever `100dvh` doesn't reclaim — so on touch devices (JS adds
       this class to <body>, see main.js) the top-anchored HUD/meter get a
       tighter, single-line-where-possible layout instead of the desktop
       spacing, to leave more of that precious top strip for the game. */
    body.touch-ui #hud {
      top: max(6px, env(safe-area-inset-top));
      font-size: 11px;
      padding: 5px 9px;
      line-height: 1.35;
      display: flex;
      gap: 8px;
    }
    body.touch-ui #hud #mapName::after { content: ' \00b7'; }
    #controlsHint {
      position: fixed;
      top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right));
      background: rgba(0,0,0,0.45);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      pointer-events: none;
      line-height: 1.6;
      text-align: right;
    }
    /* Kill feed: who eliminated whom and how, minimal (short phrase, not a
       sentence) but with a bit of visual pop — a slide-in/fade-out and
       color-coded names rather than a flat log line. Positioned mid-right,
       deliberately clear of every other overlay on both platforms: not
       top (HUD/special-meter/controlsHint), not bottom (mobile's
       joystick/action buttons, desktop's charge ring). Same position on
       both — the "match it for computer and phone" ask was about a
       consistent layout, not a different spot per device. */
    #killFeed {
      position: fixed;
      top: 35%;
      right: max(10px, env(safe-area-inset-right));
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: flex-end;
      pointer-events: none;
      z-index: 7;
    }
    .killFeedRow {
      background: rgba(0,0,0,0.5);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      max-width: 68vw;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      opacity: 1;
      transform: translateX(0);
      transition: opacity 0.4s ease-out, transform 0.4s ease-out;
      animation: killFeedIn 0.25s ease-out;
    }
    .killFeedRow.fading { opacity: 0; transform: translateX(20px); }
    .killFeedRow .killer { color: #ffcc33; font-weight: bold; }
    .killFeedRow .victim { color: #ff6b6b; font-weight: bold; }
    @keyframes killFeedIn {
      from { opacity: 0; transform: translateX(30px); }
      to { opacity: 1; transform: translateX(0); }
    }
    /* Mobile: left side instead of right (clear of the touch joystick/
       action buttons which live on the right/bottom), and noticeably
       smaller — screen space is scarcer there than on desktop. Animation
       direction flips to match: slides in from the left, fades out toward
       the left, instead of the desktop's right-side motion. */
    body.touch-ui #killFeed {
      left: max(8px, env(safe-area-inset-left));
      right: auto;
      align-items: flex-start;
    }
    body.touch-ui .killFeedRow {
      font-size: 9px;
      padding: 2px 7px;
      max-width: 48vw;
      animation-name: killFeedInLeft;
    }
    body.touch-ui .killFeedRow.fading { transform: translateX(-20px); }
    @keyframes killFeedInLeft {
      from { opacity: 0; transform: translateX(-30px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* Anchored near the top, clear of screen-center, on purpose: this
       banner covers "You were eliminated" while the local player's own
       death (fall/blood/limb-pop effect) is still playing out right where
       the camera is looking — dead-center placement would hide exactly the
       thing the player should get to watch. */
    #banner {
      position: fixed;
      top: max(96px, calc(env(safe-area-inset-top) + 96px));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.65);
      padding: 20px 36px;
      border-radius: 12px;
      font-size: 26px;
      text-align: center;
      display: none;
      pointer-events: none;
    }
    #banner .sub { font-size: 15px; opacity: 0.8; margin-top: 6px; }

    /* Combo/streak callout ("DOUBLE KILL!" etc), broadcast to every client
       so a rampage reads as an event the whole match notices, not just the
       player on the streak. Deliberately its own element, NOT reusing
       #banner: #banner is reserved for the LOCAL player's own
       grabbed/eliminated/round-over state and gets shown/hidden by that
       logic independently — a combo can fire for anyone, at any time,
       regardless of what #banner is currently doing for this viewer.
       #killFeed is edge-anchored (right on desktop, left on mobile), not
       centered, so it never actually competes for this space regardless of
       its top offset. #banner IS centered (left:50%) same as this element,
       though, and its own top is a fixed 96px (not a %) — a % top here
       would drift into #banner's ~96-191px span on common viewport heights
       (a phone at 667-1080px tall lands #comboText's 20% well inside that
       range), which matters concretely: the player just eliminated by a
       kill that also completes a combo sees BOTH their own "Eliminated"
       banner and this callout at the same instant. Pinned to a fixed
       pixel offset instead, comfortably clear of #banner's tallest state
       (title + .sub line), same idiom as #banner's own 96px offset from
       #hud above it. */
    #comboText {
      position: fixed;
      top: max(235px, calc(env(safe-area-inset-top) + 235px));
      left: 50%;
      transform: translate(-50%, -50%) scale(0.5);
      font-size: 46px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #ffcc33;
      text-shadow: 0 0 14px rgba(255,153,0,0.85), 0 2px 6px rgba(0,0,0,0.9);
      pointer-events: none;
      z-index: 8;
      opacity: 0;
      white-space: nowrap;
      transition: opacity 0.4s ease-in, transform 0.4s ease-in;
    }
    #comboText.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      transition: opacity 0.18s ease-out, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    body.touch-ui #comboText { font-size: 26px; }

    /* Small build-version tag, tucked into the corner margin so it never
       overlaps the mobile joystick (which starts 24px from this same
       corner). Bump the text each time a change ships, so it's easy to
       confirm a phone/browser has actually picked up the latest build. */
    #versionTag {
      position: fixed;
      bottom: max(4px, env(safe-area-inset-bottom));
      left: max(6px, env(safe-area-inset-left));
      font-size: 10px;
      color: rgba(255,255,255,0.35);
      pointer-events: none;
      user-select: none;
      z-index: 6;
    }

    #mouseLookHint {
      position: fixed;
      bottom: 22px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.55);
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 14px;
      pointer-events: none;
    }

    /* --- Shove charge ring (desktop) --- */
    #desktopChargeRing {
      position: fixed;
      bottom: 92px; left: 50%;
      transform: translateX(-50%);
      width: 56px; height: 56px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.4);
      background: rgba(0,0,0,0.3);
      pointer-events: none;
      z-index: 6;
      display: none;
    }
    #desktopChargeFill {
      width: 100%; height: 100%;
      border-radius: 50%;
    }

    /* --- Special-power meter (both platforms) --- */
    #specialMeter {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.45);
      padding: 8px 18px;
      border-radius: 10px;
      text-align: center;
      pointer-events: none;
      z-index: 6;
      display: none;
      transition: box-shadow 0.2s;
    }
    #specialMeter .specialTitle {
      font-size: 11px;
      letter-spacing: 1.5px;
      opacity: 0.7;
      margin-bottom: 5px;
    }
    #specialMeter .specialPips {
      display: flex;
      gap: 7px;
      justify-content: center;
      margin-bottom: 5px;
    }
    #specialMeter .pip {
      width: 14px; height: 14px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.35);
      background: transparent;
      transition: background 0.2s, box-shadow 0.2s, border-color 0.2s;
    }
    #specialMeter .pip.filled {
      background: #ffcc33;
      border-color: #ffcc33;
      box-shadow: 0 0 6px 2px rgba(255,204,51,0.7);
    }
    #specialHint {
      font-size: 12px;
      opacity: 0.85;
      white-space: nowrap;
    }
    /* Compact touch variant: drop the title line entirely (the pips + a
       short hint are already self-explanatory once the how-to-play card's
       been seen) and shrink everything else, to claim back some of the top
       strip the mobile browser's own URL bar is already eating into. */
    body.touch-ui #specialMeter {
      top: max(6px, env(safe-area-inset-top));
      padding: 4px 12px;
    }
    body.touch-ui #specialMeter .specialTitle { display: none; }
    body.touch-ui #specialMeter .specialPips { gap: 5px; margin-bottom: 2px; }
    body.touch-ui #specialMeter .pip { width: 10px; height: 10px; }
    body.touch-ui #specialHint { font-size: 10px; }
    #specialMeter.ready {
      animation: specialGlow 1.1s ease-in-out infinite;
    }
    #specialMeter.ready #specialHint {
      color: #66e0ff;
      font-weight: bold;
    }
    @keyframes specialGlow {
      0%, 100% { box-shadow: 0 0 0 rgba(102,224,255,0); }
      50% { box-shadow: 0 0 22px 5px rgba(102,224,255,0.65); }
    }

    #loginOverlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #1a1a2e, #05050a);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 10;
    }
    #loginOverlay h1 { font-size: 42px; margin-bottom: 4px; letter-spacing: 2px; }
    #loginOverlay p { opacity: 0.7; margin-top: 0; margin-bottom: 24px; }
    #nameInput {
      font-size: 18px;
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      outline: none;
      width: 260px;
      max-width: 80vw;
      text-align: center;
      margin-bottom: 14px;
    }
    #playBtn {
      font-size: 18px;
      padding: 12px 30px;
      border-radius: 8px;
      border: none;
      background: #e74c3c;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
      letter-spacing: 1px;
    }
    #playBtn:hover { background: #ff6b52; }

    /* Full control reference lives HERE, on the login screen, not in-game —
       once you've seen it once, the in-game #controlsHint only needs to be
       a bare key-name reminder (see its own comment below). */
    #howToPlay {
      margin-top: 22px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 14px 20px;
      display: grid;
      grid-template-columns: auto 1fr;
      column-gap: 12px;
      row-gap: 7px;
      font-size: 13px;
      max-width: 90vw;
    }
    #howToPlay .key {
      justify-self: end;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 5px;
      padding: 2px 8px;
      font-weight: bold;
      font-size: 11px;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    #howToPlay .action { opacity: 0.85; align-self: center; }
    /* Touch devices get their own on-screen buttons instead (joystick,
       JUMP/SHOVE/KICK/GRAB) — the keyboard/mouse reference would just be
       noise, so main.js swaps in a short touch-specific version instead
       of hiding this card outright. */

    /* --- Touch controls (mobile/tablet) --- */
    #touchControls {
      position: fixed;
      inset: 0;
      z-index: 5;
    }
    #touchLookLayer {
      position: absolute;
      inset: 0;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    #touchJoystickBase {
      position: absolute;
      left: max(24px, env(safe-area-inset-left));
      bottom: max(24px, env(safe-area-inset-bottom));
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      border: 2px solid rgba(255,255,255,0.25);
      transition: background 0.15s ease-out, border-color 0.15s ease-out;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    /* Centered purely via left:50%/top:50% + translate(-50%,-50%) — do NOT
       also add margin-left/-top here, that was stacking with the transform
       and pushing the knob up-left of true center at rest. touchControls.js
       drives this same transform dynamically while dragging (offset added
       to the -50%/-50% baseline) and swaps in a short transition only on
       release, for a smooth snap-back instead of an instant jump. */
    #touchJoystickKnob {
      position: absolute;
      left: 50%; top: 50%;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(255,255,255,0.35);
      border: 2px solid rgba(255,255,255,0.5);
      transform: translate(-50%, -50%);
      pointer-events: none;
      transition: background 0.15s ease-out;
    }
    #touchJoystickBase.active #touchJoystickKnob {
      background: rgba(255,255,255,0.55);
    }
    #touchJoystickBase.active {
      border-color: rgba(255,255,255,0.4);
      background: rgba(255,255,255,0.16);
    }
    .touchBtn {
      position: absolute;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
      border: 2px solid rgba(255,255,255,0.3);
      color: #fff;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    #touchJumpBtn {
      right: max(104px, calc(env(safe-area-inset-right) + 104px));
      bottom: max(48px, calc(env(safe-area-inset-bottom) + 48px));
    }
    #touchShoveBtn {
      right: max(24px, env(safe-area-inset-right));
      bottom: max(24px, env(safe-area-inset-bottom));
      background: rgba(231,76,60,0.35);
      border-color: rgba(231,76,60,0.6);
    }
    /* Dim and inert until the server confirms the combo is complete (see
       touchControls.js#setSpecialReady) — tapping it before then is a no-op
       anyway, so this keeps that obvious instead of surprising. */
    #touchSpecialBtn {
      right: max(24px, env(safe-area-inset-right));
      bottom: max(148px, calc(env(safe-area-inset-bottom) + 148px));
      background: rgba(102,224,255,0.12);
      border-color: rgba(102,224,255,0.3);
      opacity: 0.4;
      pointer-events: none;
      transition: opacity 0.2s, background 0.2s, border-color 0.2s;
    }
    #touchSpecialBtn.ready {
      opacity: 1;
      pointer-events: auto;
      background: rgba(102,224,255,0.35);
      border-color: rgba(102,224,255,0.9);
      animation: specialPulse 1.1s ease-in-out infinite;
    }
    @keyframes specialPulse {
      0%, 100% { box-shadow: 0 0 6px 2px rgba(102,224,255,0.5); transform: scale(1); }
      50% { box-shadow: 0 0 18px 8px rgba(102,224,255,0.85); transform: scale(1.08); }
    }
    /* Always tappable (unlike special, grab has no "ready" gate — the
       server validates range/cooldown and a whiff just silently costs
       nothing, same as a whiffed shove) — mirrors touchJumpBtn's position
       across the diagonal from touchSpecialBtn. */
    #touchGrabBtn {
      right: max(104px, calc(env(safe-area-inset-right) + 104px));
      bottom: max(172px, calc(env(safe-area-inset-bottom) + 172px));
      background: rgba(255,170,0,0.2);
      border-color: rgba(255,170,0,0.5);
    }

    /* Non-blocking portrait hint. Pure CSS (no JS needed): only shown on
       touch devices (pointer: coarse) that are currently in portrait, and
       automatically hides itself the moment the device is rotated. */
    #rotateHint {
      display: none;
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      z-index: 20;
      text-align: center;
      font-size: 13px;
      padding: 8px 16px;
      border-radius: 8px;
      pointer-events: none;
    }
    @media (orientation: portrait) and (pointer: coarse) {
      #rotateHint { display: block; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="loginOverlay">
      <h1>SUMO ARENA</h1>
      <p>Push everyone out. Last one standing wins.</p>
      <input id="nameInput" type="text" maxlength="16" placeholder="Your name" />
      <button id="playBtn">PLAY</button>
      <div id="howToPlay"></div>
    </div>

    <div id="hud" style="display:none;">
      <div id="mapName">Map: —</div>
      <div id="aliveCount">Players alive: —</div>
    </div>
    <!-- Bare key reminder only — the full explanation lives on the login
         screen's #howToPlay card, seen once before pressing PLAY. -->
    <div id="controlsHint" style="display:none;">
      WASD Move &middot; SHIFT Run<br/>
      SPACE Jump &middot; F Shove<br/>
      Q Special &middot; E Grab
    </div>
    <div id="banner"></div>
    <div id="comboText"></div>
    <div id="killFeed"></div>
    <div id="mouseLookHint" style="display:none;">Click to look around</div>

    <div id="specialMeter">
      <div class="specialTitle">SPECIAL POWER</div>
      <div class="specialPips">
        <span class="pip"></span><span class="pip"></span><span class="pip"></span>
      </div>
      <div id="specialHint">0 / 3</div>
    </div>
    <div id="desktopChargeRing"><div id="desktopChargeFill"></div></div>

    <div id="touchControls" style="display:none;">
      <div id="touchLookLayer"></div>
      <div id="touchJoystickBase">
        <div id="touchJoystickKnob"></div>
      </div>
      <div id="touchJumpBtn" class="touchBtn">JUMP</div>
      <div id="touchShoveBtn" class="touchBtn">SHOVE</div>
      <div id="touchSpecialBtn" class="touchBtn">⚡KICK</div>
      <div id="touchGrabBtn" class="touchBtn">GRAB</div>
    </div>
    <div id="rotateHint">Rotate your device for a better view</div>
    <div id="versionTag">v1.27</div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
